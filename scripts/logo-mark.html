<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Kaelo — Mark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        background: #07070b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Geist", system-ui, sans-serif;
        overflow: hidden;
      }
      .mark {
        font-size: 72vmin;
        font-weight: 500;
        letter-spacing: -0.06em;
        color: #f6f6f8;
        line-height: 0.82;
        margin-left: -0.04em; /* optical centering for the K */
      }
      .dot { color: #7c6cff; }
    </style>
  </head>
  <body>
    <div class="mark">K<span class="dot">.</span></div>
  </body>
</html>
