<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Kaelo — Wordmark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        background: #0a0a0a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        overflow: hidden;
      }
      .wordmark {
        font-size: 28vmin;
        font-weight: 500;
        letter-spacing: -0.04em;
        color: #f5f5f5;
        line-height: 0.9;
      }
      .dot { color: #e5ff00; }
    </style>
  </head>
  <body>
    <div class="wordmark">Kaelo<span class="dot">.</span></div>
  </body>
</html>
