<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Kaelo — Wordmark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        background: #07070b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Geist", system-ui, sans-serif;
        overflow: hidden;
        position: relative;
      }
      /* zachte violet glow achter het wordmark — de v2 signatuur */
      .glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 90vmin;
        height: 90vmin;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(124, 108, 255, 0.22) 0%,
          rgba(34, 211, 238, 0.06) 45%,
          transparent 70%
        );
      }
      .wordmark {
        position: relative;
        font-size: 28vmin;
        font-weight: 500;
        letter-spacing: -0.045em;
        color: #f6f6f8;
        line-height: 0.9;
      }
      .dot { color: #7c6cff; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="wordmark">Kaelo<span class="dot">.</span></div>
  </body>
</html>
